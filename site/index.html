<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSE Job Discovery — Find Your Next Opportunity</title>
<style>
  :root {
    --bg: #0b0d13; --surface: #151822; --surface2: #1c202c; --border: #262b3a;
    --text: #eceef3; --text-dim: #939aad; --accent: #6366f1; --accent-hover: #818cf8;
    --green: #34d399; --orange: #fb923c; --red: #f87171; --yellow: #fbbf24;
  }
  [data-theme="light"] {
    --bg: #f7f8fb; --surface: #ffffff; --surface2: #f0f1f6; --border: #e2e5ee;
    --text: #191b23; --text-dim: #676e82; --accent: #4f46e5; --accent-hover: #4338ca;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; transition: background 0.2s, color 0.2s; }
  a { color: inherit; text-decoration: none; }

  nav { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); }
  .nav-inner { max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 24px; }
  .brand { font-weight: 800; font-size: 1.15rem; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .nav-links { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links a { padding: 8px 12px; border-radius: 8px; font-size: 0.88rem; color: var(--text-dim); white-space: nowrap; }
  .nav-links a:hover { color: var(--text); background: var(--surface2); }
  .nav-links a.active { color: var(--accent-hover); background: var(--surface2); font-weight: 600; }
  #themeToggle { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 0.95rem; flex-shrink: 0; }

  header.hero { padding: 40px 24px 28px; text-align: center; }
  header.hero h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 800; margin-bottom: 8px; }
  header.hero p { color: var(--text-dim); font-size: 1rem; max-width: 560px; margin: 0 auto; }
  .search-bar { max-width: 680px; margin: 24px auto 0; display: flex; gap: 8px; }
  .search-bar input { flex: 1; padding: 14px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 1rem; }
  .search-bar input:focus { outline: none; border-color: var(--accent); }

  .quick-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 780px; margin: 20px auto 0; }
  .quick-links a { padding: 7px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 0.83rem; background: var(--surface); }
  .quick-links a:hover { border-color: var(--accent); color: var(--accent-hover); }

  .stats { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; margin: 28px auto; padding: 0 24px; }
  .stat { text-align: center; }
  .stat .num { font-size: 1.5rem; font-weight: 800; color: var(--accent-hover); }
  .stat .label { font-size: 0.76rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }

  main { max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; }
  .page-title { font-size: 1.4rem; font-weight: 700; margin: 8px 0 2px; }
  .page-subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 20px; }

  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 28px; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

  .filters { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; height: fit-content; position: sticky; top: 76px; }
  .filters h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 12px; }
  .filter-group { margin-bottom: 18px; }
  .filter-group label { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; padding: 5px 0; cursor: pointer; }
  .filter-group select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.85rem; }
  #clearFilters { width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; font-size: 0.82rem; }
  #clearFilters:hover { color: var(--text); border-color: var(--text-dim); }

  .results-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .results-bar .count { color: var(--text-dim); font-size: 0.88rem; }
  .results-bar select { padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.83rem; }

  .job-grid { display: grid; gap: 12px; }
  .job-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; transition: border-color 0.15s; }
  .job-card:hover { border-color: var(--accent); }
  .job-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; cursor: pointer; }
  .job-card .avatar { width: 42px; height: 42px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; color: var(--accent-hover); flex-shrink: 0; }
  .job-card .title-block { flex: 1; min-width: 0; }
  .job-card h3 { font-size: 1.02rem; font-weight: 650; }
  .job-card .company { color: var(--accent-hover); font-size: 0.86rem; margin-top: 2px; }
  .job-card .posted { font-size: 0.76rem; color: var(--text-dim); white-space: nowrap; }
  .job-card .meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 0.82rem; color: var(--text-dim); }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .skill-tag { font-size: 0.74rem; padding: 3px 9px; border-radius: 6px; background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .badge { font-size: 0.7rem; padding: 3px 9px; border-radius: 20px; font-weight: 700; }
  .badge.fresher { background: rgba(52,211,153,0.15); color: var(--green); }
  .badge.intern { background: rgba(99,102,241,0.15); color: var(--accent-hover); }
  .badge.cse { background: rgba(251,146,60,0.15); color: var(--orange); }
  .badge.closing { background: rgba(248,113,113,0.15); color: var(--red); }
  .badge.new { background: rgba(52,211,153,0.15); color: var(--green); }
  .card-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn-apply, .btn-details { padding: 9px 16px; border-radius: 8px; font-size: 0.83rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); }
  .btn-apply { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-apply:hover { background: var(--accent-hover); }
  .btn-details { background: transparent; color: var(--text); }
  .btn-details:hover { border-color: var(--accent); }

  #pagination { display: flex; justify-content: center; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  #pagination button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  #pagination button:disabled { opacity: 0.35; cursor: default; }
  #pagination button.active { background: var(--accent); border-color: var(--accent); color: white; }

  .company-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .company-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; cursor: pointer; }
  .company-card:hover { border-color: var(--accent); }
  .company-card h3 { font-size: 1rem; margin-bottom: 10px; }
  .company-card .row { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-dim); padding: 3px 0; }
  .company-card .row b { color: var(--text); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; max-width: 680px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 30px; position: relative; }
  .modal .close-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text-dim); font-size: 1.5rem; cursor: pointer; }
  .modal h2 { font-size: 1.35rem; margin-bottom: 4px; padding-right: 30px; }
  .modal .company { color: var(--accent-hover); margin-bottom: 4px; font-size: 0.95rem; }
  .modal .badges { margin-bottom: 18px; }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
  @media (max-width: 520px) { .modal-grid { grid-template-columns: 1fr; } }
  .field .k { font-size: 0.74rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.04em; margin-bottom: 3px; }
  .field .v { font-size: 0.92rem; }
  .section-heading { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin: 18px 0 8px; border-top: 1px solid var(--border); padding-top: 16px; }
  .desc-box { font-size: 0.88rem; white-space: pre-wrap; max-height: 260px; overflow-y: auto; background: var(--surface2); border-radius: 8px; padding: 14px; }
  .apply-btn { display: inline-block; margin-top: 16px; background: var(--accent); color: white; padding: 13px 24px; border-radius: 8px; font-weight: 700; }
  .apply-btn:hover { background: var(--accent-hover); }
  .source-note { font-size: 0.78rem; color: var(--text-dim); margin-top: 12px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  footer { text-align: center; padding: 28px 24px; color: var(--text-dim); font-size: 0.8rem; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="brand"><span class="dot"></span>CSE JobBoard</div>
    <div class="nav-links" id="navLinks"></div>
    <button id="themeToggle" title="Toggle theme">🌙</button>
  </div>
</nav>

<div id="app"></div>

<footer>Job listings sourced directly from official company career sites. Always apply through the official application link.</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const PAGE_SIZE = 24;
let allJobs = [];
let stats = {};
let searchQuery = '';
let currentPage = 1;
let sortMode = 'newest';
let companyFilterValue = '';
let checkboxState = { fresher: false, internship: false, cse: false, closing: false };

const ROUTES = [
  { path: '#/', label: 'Home' },
  { path: '#/fresher-jobs', label: 'Fresher Jobs' },
  { path: '#/internships', label: 'Internships' },
  { path: '#/cse-jobs', label: 'CSE Jobs' },
  { path: '#/latest-jobs', label: 'Latest Jobs' },
  { path: '#/closing-soon', label: 'Closing Soon' },
  { path: '#/companies', label: 'Companies' },
];

async function boot() {
  renderNav();
  try {
    const [indexRes, statsRes] = await Promise.all([
      fetch('../website-data/index.json'),
      fetch('../website-data/stats.json'),
    ]);
    allJobs = await indexRes.json();
    stats = await statsRes.json();
  } catch (err) {
    document.getElementById('app').innerHTML =
      '<div class="empty-state">Could not load job data. Run generate_website_data.py, and make sure you are viewing this through a local server (python -m http.server), not by opening the file directly.</div>';
    console.error(err);
    return;
  }
  window.addEventListener('hashchange', route);
  route();

  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) applyTheme(savedTheme);
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
}

function renderNav() {
  document.getElementById('navLinks').innerHTML = ROUTES.map(r =>
    `<a href="${r.path}" data-path="${r.path}">${r.label}</a>`
  ).join('');
}

function setActiveNav(path) {
  document.querySelectorAll('.nav-links a').forEach(a => {
    a.classList.toggle('active', a.dataset.path === path);
  });
}

function route() {
  const hash = location.hash || '#/';
  currentPage = 1;
  setActiveNav(hash);
  window.scrollTo(0, 0);

  if (hash === '#/companies') return renderCompaniesPage();
  if (hash === '#/fresher-jobs') return renderJobsPage('Fresher Jobs', 'Roles explicitly open to freshers and recent graduates.', j => j.fresher_eligible);
  if (hash === '#/internships') return renderJobsPage('Internships', 'Internship opportunities across all tracked companies.', j => j.internship);
  if (hash === '#/cse-jobs') return renderJobsPage('CSE / IT Jobs', 'Software, data, cloud, and other CSE-relevant roles.', j => j.cse_relevant);
  if (hash === '#/closing-soon') return renderJobsPage('Closing Soon', 'Jobs with a verified deadline coming up soon.', j => j.deadline_status === 'Closing Soon');
  if (hash === '#/latest-jobs') { sortMode = 'newest'; return renderJobsPage('Latest Jobs', 'Most recently discovered postings.', () => true); }
  return renderHomePage();
}

function renderHomePage() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="hero">
      <h1>Find Your Next Career Opportunity</h1>
      <p>Jobs, internships and fresher openings from official company career pages — updated automatically, every day.</p>
      <div class="search-bar"><input type="text" id="searchInput" placeholder="Search jobs, companies, skills, locations..."></div>
      <div class="quick-links">
        <a href="#/fresher-jobs">Fresher Jobs</a>
        <a href="#/internships">Internships</a>
        <a href="#/cse-jobs">CSE Jobs</a>
        <a href="#/closing-soon">Closing Soon</a>
        <a href="#/latest-jobs">Latest Jobs</a>
        <a href="#/companies">Browse Companies</a>
      </div>
    </header>
    <div class="stats" id="statsBar"></div>
    <main>
      <div class="page-title">All Openings</div>
      <div class="layout">
        ${filterSidebarHtml()}
        <section>
          ${resultsBarHtml()}
          <div class="job-grid" id="jobGrid"></div>
          <div id="pagination"></div>
        </section>
      </div>
    </main>
  `;
  renderStats();
  wireSearchAndFilters(() => true);
  applyFilters(() => true);
}

function renderJobsPage(title, subtitle, baseFilter) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <main>
      <div class="page-title" style="margin-top:24px;">${title}</div>
      <div class="page-subtitle">${subtitle}</div>
      <div class="layout">
        ${filterSidebarHtml(true)}
        <section>
          ${resultsBarHtml()}
          <div class="job-grid" id="jobGrid"></div>
          <div id="pagination"></div>
        </section>
      </div>
    </main>
  `;
  wireSearchAndFilters(baseFilter);
  applyFilters(baseFilter);
}

function filterSidebarHtml(hidePrimary) {
  const companies = [...new Set(allJobs.map(j => j.company))].sort();
  return `
    <aside class="filters">
      <h3>Filters</h3>
      ${hidePrimary ? '' : `
      <div class="filter-group">
        <label><input type="checkbox" id="filterFresher"> Fresher Eligible</label>
        <label><input type="checkbox" id="filterInternship"> Internship</label>
        <label><input type="checkbox" id="filterCSE"> CSE Relevant</label>
        <label><input type="checkbox" id="filterClosing"> Closing Soon</label>
      </div>`}
      <div class="filter-group">
        <div style="font-size:0.8rem;color:var(--text-dim);margin-bottom:6px;">Company</div>
        <select id="filterCompany"><option value="">All Companies</option>
          ${companies.map(c => `<option value="${escapeHtml(c)}" ${c === companyFilterValue ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
        </select>
      </div>
      <button id="clearFilters">Clear Filters</button>
    </aside>
  `;
}

function resultsBarHtml() {
  return `
    <div class="results-bar">
      <span class="count" id="resultsCount">Loading...</span>
      <select id="sortSelect">
        <option value="newest">Sort: Newest</option>
        <option value="company">Sort: Company A-Z</option>
        <option value="title">Sort: Job Title A-Z</option>
      </select>
    </div>
  `;
}

function renderStats() {
  const items = [
    [stats.total_jobs, 'Active Jobs'],
    [stats.companies, 'Companies'],
    [stats.fresher_opportunities, 'Fresher Roles'],
    [stats.internships, 'Internships'],
    [stats.cse_jobs, 'CSE / Tech Jobs'],
    [stats.closing_soon, 'Closing Soon'],
  ];
  document.getElementById('statsBar').innerHTML = items.map(([num, label]) =>
    `<div class="stat"><div class="num">${(num || 0).toLocaleString()}+</div><div class="label">${label}</div></div>`
  ).join('');
}

function wireSearchAndFilters(baseFilter) {
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.value = searchQuery;
    searchInput.addEventListener('input', debounce(() => { searchQuery = searchInput.value; applyFilters(baseFilter); }, 200));
  }
  const sortSelect = document.getElementById('sortSelect');
  sortSelect.value = sortMode;
  sortSelect.addEventListener('change', () => { sortMode = sortSelect.value; applyFilters(baseFilter); });

  const companySelect = document.getElementById('filterCompany');
  companySelect.addEventListener('change', () => { companyFilterValue = companySelect.value; applyFilters(baseFilter); });

  ['filterFresher', 'filterInternship', 'filterCSE', 'filterClosing'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      const key = id.replace('filter', '').toLowerCase();
      el.checked = checkboxState[key];
      el.addEventListener('change', () => { checkboxState[key] = el.checked; applyFilters(baseFilter); });
    }
  });

  document.getElementById('clearFilters').addEventListener('click', () => {
    searchQuery = ''; companyFilterValue = '';
    checkboxState = { fresher: false, internship: false, cse: false, closing: false };
    if (searchInput) searchInput.value = '';
    companySelect.value = '';
    ['filterFresher', 'filterInternship', 'filterCSE', 'filterClosing'].forEach(id => {
      const el = document.getElementById(id); if (el) el.checked = false;
    });
    applyFilters(baseFilter);
  });
}

function applyFilters(baseFilter) {
  const q = searchQuery.trim().toLowerCase();
  let filtered = allJobs.filter(j => {
    if (!baseFilter(j)) return false;
    if (q) {
      const haystack = `${j.job_title} ${j.company} ${j.location_raw} ${(j.skills_required || []).join(' ')} ${(j.skills_preferred || []).join(' ')}`.toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    if (checkboxState.fresher && !j.fresher_eligible) return false;
    if (checkboxState.internship && !j.internship) return false;
    if (checkboxState.cse && !j.cse_relevant) return false;
    if (checkboxState.closing && j.deadline_status !== 'Closing Soon') return false;
    if (companyFilterValue && j.company !== companyFilterValue) return false;
    return true;
  });

  filtered = sortJobs(filtered);
  window.__filteredJobs = filtered;
  renderResults(filtered);
}

function sortJobs(jobs) {
  const copy = [...jobs];
  if (sortMode === 'company') copy.sort((a, b) => (a.company || '').localeCompare(b.company || ''));
  else if (sortMode === 'title') copy.sort((a, b) => (a.job_title || '').localeCompare(b.job_title || ''));
  else copy.sort((a, b) => new Date(b.date_posted || b.first_seen || 0) - new Date(a.date_posted || a.first_seen || 0));
  return copy;
}

function renderResults(filtered) {
  const countEl = document.getElementById('resultsCount');
  const grid = document.getElementById('jobGrid');
  countEl.textContent = `${filtered.length.toLocaleString()} job${filtered.length !== 1 ? 's' : ''} found`;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">No jobs match your filters. Try clearing some.</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageJobs = filtered.slice(start, start + PAGE_SIZE);
  grid.innerHTML = pageJobs.map(jobCardHtml).join('');
  renderPagination(filtered.length);
}

function jobCardHtml(j) {
  const initials = (j.company || '?').slice(0, 2).toUpperCase();
  const skills = (j.skills_required && j.skills_required.length) ? j.skills_required : (j.skills_preferred || []);
  const skillTags = skills.slice(0, 4).map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('');
  const moreSkills = skills.length > 4 ? `<span class="skill-tag">+${skills.length - 4} more</span>` : '';
  const posted = relativeDate(j.date_posted || j.first_seen);
  const daysLeft = daysRemaining(j.application_deadline);

  return `
    <div class="job-card">
      <div class="top-row" onclick="openJob('${j.key}')">
        <div class="avatar">${initials}</div>
        <div class="title-block">
          <h3>${escapeHtml(j.job_title || 'Not specified')}</h3>
          <div class="company">${escapeHtml(j.company || '')} · ${escapeHtml(j.location_raw || 'Not specified')}</div>
        </div>
        <div class="posted">${posted}</div>
      </div>
      <div class="meta">
        <span>Experience: ${escapeHtml(j.experience_raw || 'Not specified')}</span>
        <span>Salary: ${escapeHtml(j.salary_raw || 'Not disclosed')}</span>
        <span>Type: ${escapeHtml(j.employment_type || 'Not specified')}</span>
        ${daysLeft !== null ? `<span>${daysLeft} day${daysLeft !== 1 ? 's' : ''} left</span>` : ''}
      </div>
      ${skillTags ? `<div class="skill-tags">${skillTags}${moreSkills}</div>` : ''}
      <div class="badges">
        ${j.status === 'NEW' ? '<span class="badge new">New</span>' : ''}
        ${j.fresher_eligible ? '<span class="badge fresher">Fresher</span>' : ''}
        ${j.internship ? '<span class="badge intern">Internship</span>' : ''}
        ${j.cse_relevant ? '<span class="badge cse">CSE</span>' : ''}
        ${j.deadline_status === 'Closing Soon' ? '<span class="badge closing">Closing Soon</span>' : ''}
      </div>
      <div class="card-actions">
        <a class="btn-apply" href="${j.apply_url || j.job_url || '#'}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Apply Now</a>
        <button class="btn-details" onclick="openJob('${j.key}')">View Details</button>
      </div>
    </div>
  `;
}

function renderPagination(total) {
  const totalPages = Math.ceil(total / PAGE_SIZE);
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }
  let html = `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">Prev</button>`;
  let startPage = Math.max(1, currentPage - 3);
  let endPage = Math.min(totalPages, startPage + 6);
  for (let p = startPage; p <= endPage; p++) {
    html += `<button class="${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
  }
  html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">Next</button>`;
  pag.innerHTML = html;
}

function goToPage(p) {
  currentPage = p;
  renderResults(window.__filteredJobs || []);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderCompaniesPage() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <main>
      <div class="page-title" style="margin-top:24px;">Companies</div>
      <div class="page-subtitle">All companies currently tracked, with live counts.</div>
      <div class="company-grid" id="companyGrid"></div>
    </main>
  `;
  fetch('../website-data/companies.json').then(r => r.json()).then(companies => {
    document.getElementById('companyGrid').innerHTML = companies.map(c => `
      <div class="company-card" onclick="filterByCompany('${escapeHtml(c.company)}')">
        <h3>${escapeHtml(c.company)}</h3>
        <div class="row"><span>Active Jobs</span><b>${c.active_jobs}</b></div>
        <div class="row"><span>Fresher Jobs</span><b>${c.fresher_jobs}</b></div>
        <div class="row"><span>Internships</span><b>${c.internships}</b></div>
        <div class="row"><span>CSE Jobs</span><b>${c.cse_jobs}</b></div>
      </div>
    `).join('');
  }).catch(() => {
    document.getElementById('companyGrid').innerHTML = '<div class="empty-state">Could not load companies.json.</div>';
  });
}

function filterByCompany(company) {
  companyFilterValue = company;
  location.hash = '#/';
}

async function openJob(key) {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  content.innerHTML = '<p style="color:var(--text-dim)">Loading...</p>';
  overlay.classList.add('open');
  try {
    const res = await fetch(`../website-data/jobs/${key}.json`);
    const job = await res.json();
    const daysLeft = daysRemaining(job.application_deadline);
    content.innerHTML = `
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2>${escapeHtml(job.job_title || 'Not specified')}</h2>
      <div class="company">${escapeHtml(job.company || '')} · ${escapeHtml(job.location_raw || 'Not specified')}</div>
      <div class="badges">
        ${job.status === 'NEW' ? '<span class="badge new">New</span>' : ''}
        ${job.fresher_eligible ? '<span class="badge fresher">Fresher</span>' : ''}
        ${job.internship ? '<span class="badge intern">Internship</span>' : ''}
        ${job.cse_relevant ? '<span class="badge cse">CSE</span>' : ''}
        ${job.deadline_status === 'Closing Soon' ? '<span class="badge closing">Closing Soon</span>' : ''}
      </div>

      <div class="modal-grid">
        <div class="field"><div class="k">Work Mode</div><div class="v">${escapeHtml(job.work_mode || 'Not specified')}</div></div>
        <div class="field"><div class="k">Employment Type</div><div class="v">${escapeHtml(job.employment_type || 'Not specified')}</div></div>
        <div class="field"><div class="k">Experience</div><div class="v">${escapeHtml(job.experience_raw || 'Not specified')}</div></div>
        <div class="field"><div class="k">Salary / CTC</div><div class="v">${escapeHtml(job.salary_raw || 'Not disclosed')}</div></div>
        <div class="field"><div class="k">Deadline</div><div class="v">${escapeHtml(job.application_deadline || job.deadline_status || 'Not specified')}${daysLeft !== null ? ` (${daysLeft} days left)` : ''}</div></div>
        <div class="field"><div class="k">Date Posted</div><div class="v">${escapeHtml(job.date_posted || 'Not specified')}</div></div>
        <div class="field"><div class="k">Degree Required</div><div class="v">${(job.education_required || []).join(', ') || 'Not specified'}</div></div>
        <div class="field"><div class="k">Branch</div><div class="v">${(job.branch_required || []).join(', ') || 'Not specified'}</div></div>
      </div>

      ${(job.skills_required || []).length ? `
        <div class="section-heading">Required Skills</div>
        <div class="skill-tags">${job.skills_required.map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('')}</div>
      ` : ''}
      ${(job.skills_preferred || []).length ? `
        <div class="section-heading">Preferred Skills</div>
        <div class="skill-tags">${job.skills_preferred.map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('')}</div>
      ` : ''}

      <div class="section-heading">Job Description</div>
      <div class="desc-box">${escapeHtml(stripHtml(job.job_description || 'Not specified')).slice(0, 4000)}</div>

      <a class="apply-btn" href="${job.apply_url || job.job_url || '#'}" target="_blank" rel="noopener">Apply on Official Website</a>
      <div class="source-note">Source: ${escapeHtml(job.source_website || 'Not specified')}</div>
    `;
  } catch (err) {
    content.innerHTML = '<button class="close-btn" onclick="closeModal()">&times;</button><p>Could not load job details.</p>';
  }
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function toggleTheme() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  applyTheme(isLight ? 'dark' : 'light');
}
function applyTheme(theme) {
  if (theme === 'light') { document.documentElement.setAttribute('data-theme', 'light'); document.getElementById('themeToggle').textContent = '☀️'; }
  else { document.documentElement.removeAttribute('data-theme'); document.getElementById('themeToggle').textContent = '🌙'; }
  localStorage.setItem('theme', theme);
}

function relativeDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const days = Math.floor((Date.now() - d) / 86400000);
  if (days <= 0) return 'Today';
  if (days === 1) return '1 day ago';
  if (days < 30) return `${days} days ago`;
  return d.toLocaleDateString();
}
function daysRemaining(deadlineStr) {
  if (!deadlineStr) return null;
  const d = new Date(deadlineStr);
  if (isNaN(d)) return null;
  return Math.ceil((d - Date.now()) / 86400000);
}
function stripHtml(str) {
  const div = document.createElement('div');
  div.innerHTML = str;
  return div.textContent || div.innerText || '';
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

boot();
</script>
