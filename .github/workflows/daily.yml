name: Daily Job Search

on:
  schedule:
    # 03:30 UTC = 09:00 IST, every day
    - cron: '30 3 * * *'
    # Extra company-site refreshes every 6 hours (no portal scraping, no email)
    # so new top matches reach Telegram within hours instead of a day.
    - cron: '30 9,15,21 * * *'
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sites to scrape (space separated, or "all")'
        required: false
        default: 'all'
      top:
        description: 'How many top matches to print'
        required: false
        default: '20'

concurrency:
  group: daily-job-search
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  search:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      # Search / profile settings
      SEARCH_KEYWORDS: 'python developer fresher,machine learning fresher,data scientist fresher,software engineer fresher'
      YOUR_SKILLS: 'python,tensorflow,opencv,pandas,numpy,react,flask,git,linux,sql,machine learning'
      LOCATION: 'India'
      CITIES: 'Bangalore,Hyderabad,Pune,Mumbai,Chennai,Delhi,Ahmedabad,Remote'
      ALLOWED_JOB_TYPES: 'Full Time,Internship'
      PREFERRED_SOURCES: 'LinkedIn,Indeed,Naukri,Wellfound,Unstop,Foundit,Internshala,Shine,Government'
      MAX_JOBS_PER_SITE: '50'
      MIN_MATCH_SCORE: '0'
      REMOTE_ONLY: 'false'
      HEADLESS: 'true'
      REQUEST_DELAY: '2'
      # Secrets (add these under Settings → Secrets and variables → Actions)
      EMAIL_ID: ${{ secrets.EMAIL_ID }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      APPLICANT_NAME: ${{ secrets.APPLICANT_NAME }}
      APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
      APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE }}
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Create runtime folders
        run: mkdir -p output logs data

      - name: Verify configuration loads
        run: |
          python - << 'PY'
          import os
          import config
          print("Keywords :", config.SEARCH_KEYWORDS)
          print("Cities   :", config.CITIES)
          print("Email configured  :", bool(os.getenv("EMAIL_ID")) and bool(os.getenv("EMAIL_PASSWORD")))
          print("Config loaded successfully.")
          PY

      - name: Run job search
        id: scrape
        if: github.event.schedule != '30 9,15,21 * * *'
        continue-on-error: true
        run: |
          python main.py \
            --sites ${{ github.event.inputs.sites || 'all' }} \
            --top ${{ github.event.inputs.top || '20' }} \
            --retries 2

      - name: Verify newly added companies (ATS auto-detection)
        continue-on-error: true
        run: |
          python scripts/detect_ats_platform.py

      - name: Run ATS company pipeline (Greenhouse/Lever/Workday/...)
        id: ats
        continue-on-error: true
        run: |
          mkdir -p output/step_logs
          python run_ats_pipeline.py 2>&1 | tee output/step_logs/pipeline.log; test ${PIPESTATUS[0]} -eq 0

      - name: Company health check
        if: always()
        continue-on-error: true
        run: |
          mkdir -p output/step_logs
          python scripts/company_health.py 2>&1 | tee output/step_logs/health.log; test ${PIPESTATUS[0]} -eq 0
          [ -f output/health_report.md ] && cat output/health_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open, update or close the health alert issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f output/health_alert_count ] || exit 0
          COUNT=$(cat output/health_alert_count)
          TITLE="Scraper health alert"
          gh label create scraper-health --color D93F0B --description "Automated scraper health alerts" 2>/dev/null || true
          ISSUE=$(gh issue list --label scraper-health --state open --json number -q '.[0].number')
          if [ "$COUNT" -gt 0 ]; then
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body-file output/health_report.md
            else
              gh issue create --title "$TITLE" --label scraper-health --body-file output/health_report.md
            fi
          elif [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --comment "All company scrapers healthy again in run ${{ github.run_number }}."
          fi

      - name: Build website
        id: site
        if: always()
        continue-on-error: true
        env:
          # Public values (Settings > Secrets and variables > Actions > Variables)
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          # Secret, used only here in CI to sync automated notices and read published records
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p output/step_logs
          exec > >(tee output/step_logs/website.log) 2>&1
          set -x
          if [ -f output/ats_jobs.json ]; then
            python generate_website_data.py --input output/ats_jobs.json --out website-data
          else
            echo "::warning::No ATS output this run; company listings will be missing from the site"
            mkdir -p website-data
          fi
          python scripts/validate_govt_jobs.py
          python scripts/build_govt_data.py
          python scripts/build_site.py --out _site
          du -sh _site

      - name: Upload website artifact
        if: steps.site.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Persist ATS job history and verified companies
        if: always()
        run: |
          mkdir -p output/step_logs
          exec > >(tee output/step_logs/persist.log) 2>&1
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/ats_job_history.json config/companies.json data/company_health.json; do
            [ -f "$f" ] && git add -- "$f"
          done
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "chore: update ATS job history"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1

      - name: Check results
        id: results
        run: |
          python - << 'PY'
          import json, os, pathlib
          count = 0
          for name in ("output/jobs_enriched.json", "output/jobs_found.json", "output/ats_jobs.json"):
              path = pathlib.Path(name)
              if path.exists() and path.stat().st_size:
                  try:
                      count = max(count, len(json.loads(path.read_text(encoding="utf-8"))))
                  except (json.JSONDecodeError, TypeError):
                      pass
          found = "true" if count else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"found={found}\n")
          if count:
              print(f"{count} jobs collected.")
          else:
              print("::warning::No jobs scraped this run (portals may have blocked the runner IP). Skipping email.")
          PY

      - name: Send Telegram alerts
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_alert.py

      - name: Check official links on government records
        if: always() && steps.site.outcome == 'success' && github.event.schedule != '30 9,15,21 * * *'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/check_links.py 2>&1 | tee output/step_logs/links.log

      - name: Send user email alerts (opted-in accounts)
        if: always() && steps.site.outcome == 'success' && github.event.schedule != '30 9,15,21 * * *'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/send_user_alerts.py 2>&1 | tee output/step_logs/user_alerts.log

      - name: Send email digest
        if: steps.results.outputs.found == 'true' && github.event.schedule != '30 9,15,21 * * *'
        run: python email_alert.py

      - name: Publish run report (run-reports branch)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/report
          cp -r output/step_logs /tmp/report/ 2>/dev/null || true
          for f in output/health_report.md output/company_run_stats.json; do [ -f "$f" ] && cp "$f" /tmp/report/; done
          [ -f output/top_matches.json ] && python -c "import json;t=json.load(open('output/top_matches.json'));json.dump([{k:j.get(k) for k in ('match_score','company','job_title','location_raw','status','apply_url')} for j in t[:100]],open('/tmp/report/top_matches_top100.json','w'),indent=1)"
          echo "run ${{ github.run_number }} at $(date -u +%FT%TZ), event ${{ github.event_name }} ${{ github.event.schedule }}" > /tmp/report/RUN.txt
          cd /tmp/report && git init -q && git checkout -q -b run-reports
          git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "run ${{ github.run_number }} report"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" run-reports

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-results-${{ github.run_number }}
          path: |
            output/
            logs/
          if-no-files-found: ignore
          retention-days: 14

  deploy-site:
    # Publishes the job board to GitHub Pages. One-time setup in the repo:
    # Settings > Pages > Build and deployment > Source: GitHub Actions.
    needs: search
    if: always() && needs.search.result == 'success'
    runs-on: ubuntu-22.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
